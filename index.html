<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#050608">
  <title>KICKNITY — Manutenção</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, Rubik, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #050608;
      color: #fff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 46%, rgba(255, 255, 255, 0.07), transparent 34%),
        #050608;
    }

    h1 {
      margin: 0;
      padding: 1rem;
      color: #fff;
      font-size: clamp(2rem, 7vw, 5.5rem);
      font-weight: 900;
      line-height: 1;
      letter-spacing: 0.08em;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>MANUTENÇÃO</h1>
</body>
</html>
