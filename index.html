<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#050608">
  <title>KICKNITY — Manutenção</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, Rubik, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #050608;
      color: #fff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 46%, rgba(255, 255, 255, 0.07), transparent 34%),
        #050608;
    }

    h1 {
      margin: 0;
      color: #fff;
      font-size: clamp(2rem, 7vw, 5.5rem);
      font-weight: 900;
      line-height: 1;
      letter-spacing: 0.08em;
      text-align: center;
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(0.8rem, 2vw, 1.35rem);
      padding: 1.5rem;
    }

    p {
      margin: 0;
      color: #fff;
      font-size: clamp(0.85rem, 2vw, 1.35rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: 0.42em;
      text-indent: 0.42em;
      animation: kicknity-glow 1.8s ease-in-out infinite;
    }

    @keyframes kicknity-glow {
      0%, 100% {
        opacity: 0.58;
        text-shadow: 0 0 4px rgba(255, 255, 255, 0.3);
      }
      50% {
        opacity: 1;
        text-shadow:
          0 0 8px rgba(255, 255, 255, 0.95),
          0 0 20px rgba(255, 255, 255, 0.7),
          0 0 38px rgba(255, 255, 255, 0.4);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      p {
        animation: none;
        opacity: 1;
        text-shadow: 0 0 14px rgba(255, 255, 255, 0.75);
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>MANUTENÇÃO</h1>
    <p>KICKNITY</p>
  </main>
</body>
</html>
